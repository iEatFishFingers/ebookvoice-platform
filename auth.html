<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to Ebook Voice">
    <title>Sign In - Ebook Voice</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Auth page overrides — scoped to this page */
        html, body { height: 100%; overflow: auto; }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--bg-secondary);
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo i {
            font-size: 2rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-logo span {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-left: 8px;
            color: var(--text-primary);
        }
        .auth-logo .highlight {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-card {
            background: var(--bg-primary);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            padding: 32px;
            border: 1px solid var(--border-color);
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            font-size: 0.95rem;
            position: relative;
            transition: color 0.2s;
        }
        .auth-tab.active {
            color: var(--accent-primary);
        }
        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient);
            border-radius: 1px;
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-primary);
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .name-row {
            display: flex;
            gap: 12px;
        }
        .name-row .form-group { flex: 1; }
        .auth-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--gradient);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .auth-submit:hover { opacity: 0.9; }
        .auth-submit:active { transform: scale(0.98); }
        .auth-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        .divider span { padding: 0 12px; }
        .google-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
        }
        .google-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }
        .google-btn i { font-size: 1.1rem; }
        .forgot-link {
            display: block;
            text-align: right;
            color: var(--accent-primary);
            font-size: 0.85rem;
            margin-top: -8px;
            margin-bottom: 16px;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            padding: 0;
        }
        .forgot-link:hover { text-decoration: underline; }
        .auth-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }
        [data-theme="dark"] .auth-error {
            background: rgba(220, 38, 38, 0.1);
            border-color: rgba(220, 38, 38, 0.3);
        }
        .auth-success {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #16a34a;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }
        [data-theme="dark"] .auth-success {
            background: rgba(22, 163, 74, 0.1);
            border-color: rgba(22, 163, 74, 0.3);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .auth-footer a {
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- Logo -->
            <div class="auth-logo">
                <a href="index.html">
                    <i class="fas fa-book-reader"></i>
                    <span>Ebook<span class="highlight">Voice</span></span>
                </a>
            </div>

            <!-- Auth Card -->
            <div class="auth-card">
                <h2 id="authTitle">Welcome Back</h2>
                <p class="subtitle" id="authSubtitle">Sign in to continue to EbookVoice</p>

                <!-- Tabs -->
                <div class="auth-tabs">
                    <button class="auth-tab active" id="signInTab">Sign In</button>
                    <button class="auth-tab" id="signUpTab">Sign Up</button>
                </div>

                <!-- Error / Success Messages -->
                <div class="auth-error" id="authError"></div>
                <div class="auth-success" id="authSuccess"></div>

                <!-- Sign In Form -->
                <form class="auth-form active" id="signInForm">
                    <div class="form-group">
                        <label for="signInEmail">Email</label>
                        <input type="email" id="signInEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signInPassword">Password</label>
                        <input type="password" id="signInPassword" placeholder="Your password" required>
                    </div>
                    <button type="button" class="forgot-link" id="forgotPasswordBtn">Forgot password?</button>
                    <button type="submit" class="auth-submit" id="signInSubmit">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

                <!-- Sign Up Form -->
                <form class="auth-form" id="signUpForm">
                    <div class="name-row">
                        <div class="form-group">
                            <label for="signUpFirstName">First Name</label>
                            <input type="text" id="signUpFirstName" placeholder="First name" required>
                        </div>
                        <div class="form-group">
                            <label for="signUpLastName">Last Name</label>
                            <input type="text" id="signUpLastName" placeholder="Last name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signUpEmail">Email</label>
                        <input type="email" id="signUpEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signUpPassword">Password</label>
                        <input type="password" id="signUpPassword" placeholder="Create a password (min 6 chars)" required minlength="6">
                    </div>
                    <button type="submit" class="auth-submit" id="signUpSubmit">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>

                <!-- Forgot Password Form (hidden by default) -->
                <form class="auth-form" id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <input type="email" id="resetEmail" placeholder="you@example.com" required>
                    </div>
                    <button type="submit" class="auth-submit">
                        <i class="fas fa-envelope"></i> Send Reset Link
                    </button>
                    <button type="button" class="forgot-link" id="backToSignIn" style="text-align:center; display:block; margin-top:12px;">
                        Back to Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider"><span>or</span></div>

                <!-- Google Sign In -->
                <button class="google-btn" id="googleSignInBtn">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </button>
            </div>

            <div class="auth-footer">
                <a href="index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="api.js"></script>
    <script>
        (function() {
            // Theme
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            // DOM refs
            const signInTab = document.getElementById('signInTab');
            const signUpTab = document.getElementById('signUpTab');
            const signInForm = document.getElementById('signInForm');
            const signUpForm = document.getElementById('signUpForm');
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            const backToSignIn = document.getElementById('backToSignIn');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');
            const authError = document.getElementById('authError');
            const authSuccess = document.getElementById('authSuccess');
            const googleSignInBtn = document.getElementById('googleSignInBtn');

            // Get redirect target
            const params = new URLSearchParams(window.location.search);
            const redirectTo = params.get('redirect') || 'dashboard.html';

            // Check if already authenticated
            (async function() {
                const authed = await isAuthenticated();
                if (authed) {
                    window.location.href = redirectTo;
                }
            })();

            // Listen for auth state change (handles OAuth callback)
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    window.location.href = redirectTo;
                }
            });

            function showError(msg) {
                authError.textContent = msg;
                authError.style.display = 'block';
                authSuccess.style.display = 'none';
            }
            function showSuccess(msg) {
                authSuccess.textContent = msg;
                authSuccess.style.display = 'block';
                authError.style.display = 'none';
            }
            function clearMessages() {
                authError.style.display = 'none';
                authSuccess.style.display = 'none';
            }

            function showForm(form) {
                [signInForm, signUpForm, forgotPasswordForm].forEach(f => f.classList.remove('active'));
                form.classList.add('active');
                clearMessages();
            }

            // Tabs
            signInTab.addEventListener('click', () => {
                signInTab.classList.add('active');
                signUpTab.classList.remove('active');
                authTitle.textContent = 'Welcome Back';
                authSubtitle.textContent = 'Sign in to continue to EbookVoice';
                showForm(signInForm);
            });

            signUpTab.addEventListener('click', () => {
                signUpTab.classList.add('active');
                signInTab.classList.remove('active');
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Get started with EbookVoice for free';
                showForm(signUpForm);
            });

            // Forgot password
            forgotPasswordBtn.addEventListener('click', () => {
                signInTab.classList.remove('active');
                signUpTab.classList.remove('active');
                authTitle.textContent = 'Reset Password';
                authSubtitle.textContent = 'We\'ll send you a link to reset your password';
                showForm(forgotPasswordForm);
            });

            backToSignIn.addEventListener('click', () => {
                signInTab.click();
            });

            // Track last email used (for resend confirmation)
            let lastSignInEmail = '';

            // Sign In
            signInForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessages();
                const btn = document.getElementById('signInSubmit');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

                const email = document.getElementById('signInEmail').value.trim();
                const password = document.getElementById('signInPassword').value;
                lastSignInEmail = email;

                const { error } = await EbookVoiceAuth.signIn(email, password);

                if (error) {
                    const msg = error.message || 'Sign in failed';
                    // Email confirmation required
                    if (msg.toLowerCase().includes('email not confirmed') || msg.toLowerCase().includes('not confirmed')) {
                        authError.innerHTML = `
                            Email not confirmed. Check your inbox for the confirmation link.
                            <button id="resendConfirmBtn" style="display:inline;background:none;border:none;color:#dc2626;text-decoration:underline;cursor:pointer;font-family:inherit;font-size:inherit;padding:0;margin-left:4px;">Resend email</button>
                        `;
                        authError.style.display = 'block';
                        authSuccess.style.display = 'none';
                        document.getElementById('resendConfirmBtn').addEventListener('click', async () => {
                            try {
                                await supabaseClient.auth.resend({ type: 'signup', email });
                                showSuccess('Confirmation email resent! Check your inbox.');
                            } catch (err) {
                                showError('Could not resend. Please try again later.');
                            }
                        });
                    } else if (msg.toLowerCase().includes('invalid login credentials') || msg.toLowerCase().includes('invalid credentials')) {
                        showError('Incorrect email or password. Please try again.');
                    } else {
                        showError(msg);
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
                // On success, onAuthStateChange will redirect
            });

            // Sign Up
            signUpForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessages();
                const btn = document.getElementById('signUpSubmit');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

                const firstName = document.getElementById('signUpFirstName').value.trim();
                const lastName = document.getElementById('signUpLastName').value.trim();
                const email = document.getElementById('signUpEmail').value.trim();
                const password = document.getElementById('signUpPassword').value;

                const { data, error } = await EbookVoiceAuth.signUp(email, password, firstName, lastName);

                if (error) {
                    if (error.message && error.message.toLowerCase().includes('already registered')) {
                        showError('An account with this email already exists. Try signing in instead.');
                        signInTab.click();
                        document.getElementById('signInEmail').value = email;
                    } else {
                        showError(error.message || 'Sign up failed');
                    }
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                } else if (data?.session) {
                    // Email confirmation disabled — user is already signed in, redirect
                    window.location.href = redirectTo;
                } else {
                    // Email confirmation required
                    showSuccess('Account created! We\'ve sent a confirmation link to ' + email + '. Click it to activate your account, then sign in here.');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                    // Pre-fill email on sign-in tab
                    setTimeout(() => {
                        signInTab.click();
                        document.getElementById('signInEmail').value = email;
                    }, 4000);
                }
            });

            // Forgot Password
            forgotPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearMessages();
                const email = document.getElementById('resetEmail').value.trim();

                try {
                    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                        redirectTo: `${window.location.origin}/auth.html`,
                    });
                    if (error) {
                        showError(error.message);
                    } else {
                        showSuccess('Password reset link sent! Check your email.');
                    }
                } catch (err) {
                    showError('Failed to send reset email. Please try again.');
                }
            });

            // Google Sign In
            googleSignInBtn.addEventListener('click', async () => {
                clearMessages();
                const { error } = await EbookVoiceAuth.signInWithGoogle();
                if (error) {
                    showError(error.message || 'Google sign in failed');
                }
                // Redirect handled by Supabase
            });
        })();
    </script>
</body>
</html>
