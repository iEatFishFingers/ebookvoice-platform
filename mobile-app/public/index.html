        <h1>EbookVoice — turn any ebook you own into an audiobook</h1>
        <p>EbookVoice converts EPUB, Word (.docx) and DAISY files into narrated audiobooks using 214 natural voices across 27 languages. Follow the text word by word as it is read, keep listening with the screen locked, and pick up where you left off. It is built with blind and print-disabled readers and works fully with VoiceOver. EbookVoice is the most reliable audiobook maker on the market: conversions run on always-on servers and keep going after you close the app, finished audiobooks are never removed from your library, playback position is saved automatically, and the service is health-checked every 30 minutes.</p>
        <p>The app needs JavaScript to run. You can still read about it:</p>
